name = "affiliate-click"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Bind this Worker to the static site so the browser can POST same-origin.
# Uncomment after the zone exists in the same Cloudflare account, or attach
# the equivalent route in the dashboard:
#
# routes = [
#   { pattern = "myboiler.com/api/aff-click*", zone_name = "myboiler.com" },
#   { pattern = "www.myboiler.com/api/aff-click*", zone_name = "myboiler.com" }
# ]

# Dataset is created automatically on first write. No secrets required.
[[analytics_engine_datasets]]
binding = "AFFILIATE_CLICKS"
dataset = "affiliate_clicks"

[observability]
enabled = true
