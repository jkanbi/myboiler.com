name = "optimiser-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# Production routes on zone myboiler.com (attach in the dashboard):
#   myboiler.com/api/optimiser-feedback*
#   www.myboiler.com/api/optimiser-feedback*
#   myboiler.com/api/optimiser-feedbacks*
#   www.myboiler.com/api/optimiser-feedbacks*
#   myboiler.com/api/optimiser-event*
#   www.myboiler.com/api/optimiser-event*
#
# Uncomment after the zone exists in the same Cloudflare account, or attach
# the equivalent routes in the dashboard:
#
# routes = [
#   { pattern = "myboiler.com/api/optimiser-feedback*", zone_name = "myboiler.com" },
#   { pattern = "www.myboiler.com/api/optimiser-feedback*", zone_name = "myboiler.com" },
#   { pattern = "myboiler.com/api/optimiser-feedbacks*", zone_name = "myboiler.com" },
#   { pattern = "www.myboiler.com/api/optimiser-feedbacks*", zone_name = "myboiler.com" },
#   { pattern = "myboiler.com/api/optimiser-event*", zone_name = "myboiler.com" },
#   { pattern = "www.myboiler.com/api/optimiser-event*", zone_name = "myboiler.com" }
# ]

# Workers KV — reuse the existing namespace used by affiliate-click
# and fault-code-request. Keys use prefix `optimiser:` (feedback) and
# `optimiser-events:` (daily event cap) so they do not collide with
# `clicks:` or `requests:`.
[[kv_namespaces]]
binding = "REQUESTS"
id = "ad9fa2773ca549479e432b257fad3c48"

# D1 — anonymous Optimiser events. Schema is already applied; do not migrate.
[[d1_databases]]
binding = "DB"
database_name = "optimiser-events"
database_id = "a0a5fbcd-422d-4327-a0bb-eb2422ffce0b"

# Secret (not in this file — never commit it):
#   npx wrangler secret put LIST_SECRET
# Used as: Authorization: Bearer <LIST_SECRET> on GET /api/optimiser-feedbacks
# Local: put LIST_SECRET=... in `.dev.vars` (gitignored).
#
# Retention: rows older than 400 days are deleted at most once a day from
# inside the Worker on /api/optimiser-event (KV guard optimiser:purge:YYYY-MM-DD,
# ctx.waitUntil). No cron trigger — the account is at the free-plan cron limit.

[observability]
enabled = true
