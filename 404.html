<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - MyBoiler.com</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
    <style>
        body.not-found-page {
            min-height: 100vh;
        }

        #page-content.error-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(2.5rem, 8vh, 5rem) clamp(20px, 5vw, 40px);
            min-height: 0;
        }

        #page-content.error-page h1 {
            font-size: clamp(2rem, 6vw, 3.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text);
            margin: 0 0 0.75rem;
        }

        #page-content.error-page p {
            font-size: clamp(1rem, 2vw, 1.125rem);
            line-height: 1.5;
            color: var(--text-muted);
            margin: 0 0 1.5rem;
            max-width: 36ch;
        }

        #page-content.error-page .error-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem 1.25rem;
            margin: 0;
        }

        #page-content.error-page .error-links a {
            font-weight: 600;
        }
    </style>
    <script type="text/javascript" src="/js/site-nav.js" data-cfasync="false"></script>
    <script type="text/javascript" src="/js/menu.js" data-cfasync="false"></script>
    <script type="text/javascript" data-cfasync="false">
        // GitHub Pages 404: strip legacy /hub prefix; otherwise show not-found.
        (function() {
            'use strict';

            // Served as-is from the site root. Content pages also live at root
            // paths. Apps keep /chat/, /quote/, /decide/, /heat-pump-checker/.
            const STATIC_FOLDERS = [
                'css', 'js', 'img', 'pages', 'assets',
                'calculators', 'chat', 'decide', 'quote', 'heat-pump-checker'
            ];
            const ROOT_FILES = ['favicon.ico', 'CNAME', 'robots.txt', '404.html', ''];

            const path = window.location.pathname;
            const pathSegments = path.split('/').filter(function(segment) { return segment; });
            const isStaticAsset = pathSegments.length > 0 && STATIC_FOLDERS.includes(pathSegments[0]);
            const isRootFile = ROOT_FILES.includes(pathSegments[0] || '') || path === '/';

            // Legacy /hub/... URLs redirect to the same path without /hub.
            // Do not prefix unknown paths with /hub.
            if (path === '/hub' || path.indexOf('/hub/') === 0) {
                const stripped = (path === '/hub' || path === '/hub/') ? '/' : path.replace(/^\/hub/, '');
                window.location.replace(window.location.origin + stripped + window.location.search);
                return;
            }

            if (isStaticAsset || isRootFile) {
                return;
            }

            function showNotFound() {
                var content = document.getElementById('page-content');
                if (!content) return;
                document.title = 'Page not found - MyBoiler.com';
                content.classList.add('error-page');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', showNotFound);
            } else {
                showNotFound();
            }
        })();
    </script>
</head>
<body class="not-found-page">
    <div class="menu-overlay"></div>
    <div class="nav-mega-backdrop" aria-hidden="true"></div>
    <header class="header">
        <a href="/" class="logo">
            <img src="/img/myboiler-logo-light.svg" alt="MyBoiler Logo" width="200" height="44" class="light-mode-logo js-theme-logo">
            <img src="/img/myboiler-logo-dark.svg" alt="MyBoiler Logo" width="200" height="44" class="dark-mode-logo js-theme-logo">
        </a>
        <div class="tagline">Smarter Heating & Hot Water</div>
        <div class="right-header-items">
            <button class="hamburger-menu" onclick="toggleMenu()" aria-label="Toggle Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <nav id="nav-menu" class="nav-menu"><ul class="nav-list"><li class="nav-item"><a href="/advice/">Advice</a></li><li class="nav-item"><a href="/toolbox/">Toolbox</a></li><li class="nav-item nav-item-cta"><a href="/chat/">Ask AI</a></li></ul></nav>
        </div>
    </header>

    <div id="page-content" class="error-page">
        <h1>404</h1>
        <p>The requested page could not be found.</p>
        <p class="error-links"><a href="/">Home</a><a href="/toolbox/">Toolbox</a></p>
    </div>

    <div id="site-footer"></div>
</body>
</html>
