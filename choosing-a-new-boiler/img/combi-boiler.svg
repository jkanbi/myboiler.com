<svg xmlns="http://www.w3.org/2000/svg" class="guide-svg" viewBox="0 0 260 392" width="100%" height="auto" role="img" aria-labelledby="combi-title">
  <title id="combi-title">Combi boiler: boiler only, fed from the cold mains. No hot-water cylinder and no loft tanks. The boiler heats the taps and the radiators.</title>
  <rect x="1" y="1" width="258" height="390" rx="12" fill="var(--bg, #ebeced)" stroke="var(--border, #dfe2e6)"/>
  <text x="130" y="28" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Combi</text>
  <text x="130" y="46" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">Boiler only</text>
  <path d="M42 92 L130 50 L218 92" fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="52" y="92" width="156" height="248" fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.5"/>
  <line x1="52" y1="128" x2="208" y2="128" stroke="var(--border, #dfe2e6)" stroke-width="1.25"/>
  <text x="130" y="115" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="10">Empty loft, no tanks</text>
  <rect x="68" y="154" width="46" height="60" rx="4" fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.4"/>
  <rect x="72" y="158" width="38" height="10" rx="2" fill="var(--accent, #1863dc)"/>
  <path d="M91 178c0 0-3.2 4.2-3.2 6.6a3.2 3.2 0 1 0 6.4 0c0-2.4-3.2-6.6-3.2-6.6z" fill="var(--surface, #fff)"/>
  <text x="91" y="228" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Boiler</text>
  <path d="M114 184 H168" fill="none" stroke="var(--accent-dark, #0f4eb5)" stroke-width="1.6"/>
  <path d="M168 184 V198" fill="none" stroke="var(--accent-dark, #0f4eb5)" stroke-width="1.6"/>
  <path d="M160 198 h16 v8 h-4 l2 8 h-12 l2-8 h-4z" fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.2"/>
  <text x="168" y="226" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Taps</text>
  <path d="M91 214 V246" fill="none" stroke="var(--text-muted, #6b7280)" stroke-width="1.5"/>
  <g transform="translate(68 246)" fill="var(--surface, #fff)" stroke="var(--text-muted, #6b7280)" stroke-width="1.15">
    <rect x="0" y="0" width="8" height="28" rx="1"/>
    <rect x="10" y="0" width="8" height="28" rx="1"/>
    <rect x="20" y="0" width="8" height="28" rx="1"/>
    <rect x="30" y="0" width="8" height="28" rx="1"/>
    <rect x="40" y="0" width="8" height="28" rx="1"/>
  </g>
  <text x="91" y="290" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Radiators</text>
  <path d="M32 318 H91 V214" fill="none" stroke="var(--accent, #1863dc)" stroke-width="1.7"/>
  <circle cx="32" cy="318" r="3" fill="var(--accent, #1863dc)"/>
  <text x="78" y="334" text-anchor="middle" fill="var(--accent, #1863dc)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Cold mains</text>
  <text x="130" y="368" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">No cylinder or loft tanks</text>
</svg>
