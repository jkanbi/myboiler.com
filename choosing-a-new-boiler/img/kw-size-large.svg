<svg xmlns="http://www.w3.org/2000/svg" class="guide-svg" viewBox="0 0 240 268" width="100%" height="auto" role="img" aria-labelledby="kw-large-title">
  <title id="kw-large-title">Larger house: typical combi domestic hot water 32 to 42 kilowatts, still limited by the cold main; typical system or heat-only heating 24 to 30 kilowatts, or more if the heat-loss says so.</title>
  <rect x="1" y="1" width="238" height="266" rx="12" fill="var(--bg, #ebeced)" stroke="var(--border, #dfe2e6)"/>
  <g fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.4">
    <path d="M22 52 L78 20 L134 52" stroke-linejoin="round"/>
    <rect x="30" y="52" width="96" height="68" rx="2"/>
    <path d="M126 60 L176 32 L226 60" stroke-linejoin="round"/>
    <rect x="134" y="60" width="84" height="60" rx="2"/>
  </g>
  <g fill="var(--bg, #ebeced)" stroke="var(--border, #dfe2e6)" stroke-width="1">
    <rect x="42" y="62" width="16" height="12" rx="1"/>
    <rect x="68" y="62" width="16" height="12" rx="1"/>
    <rect x="94" y="62" width="16" height="12" rx="1"/>
    <rect x="42" y="88" width="16" height="12" rx="1"/>
    <rect x="94" y="88" width="16" height="12" rx="1"/>
    <rect x="66" y="96" width="12" height="24" rx="1"/>
    <rect x="148" y="70" width="16" height="12" rx="1"/>
    <rect x="178" y="70" width="16" height="12" rx="1"/>
    <rect x="148" y="92" width="16" height="12" rx="1"/>
    <rect x="178" y="92" width="16" height="12" rx="1"/>
  </g>
  <text x="120" y="140" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Larger house</text>
  <text x="120" y="158" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="10">Several outlets, many radiators</text>
  <text x="120" y="192" text-anchor="middle" fill="var(--accent, #1863dc)" font-family="system-ui, sans-serif" font-size="16" font-weight="700">32–42 kW</text>
  <text x="120" y="210" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">Combi DHW, limited by the cold main</text>
  <text x="120" y="238" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="16" font-weight="700">24–30 kW</text>
  <text x="120" y="256" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">System / heat-only, or more if heat-loss says so</text>
</svg>
