<svg xmlns="http://www.w3.org/2000/svg" class="guide-svg" viewBox="0 0 240 268" width="100%" height="auto" role="img" aria-labelledby="kw-small-title">
  <title id="kw-small-title">Small flat or house: typical combi domestic hot water 24 to 28 kilowatts; typical system or heat-only heating 12 to 18 kilowatts.</title>
  <rect x="1" y="1" width="238" height="266" rx="12" fill="var(--bg, #ebeced)" stroke="var(--border, #dfe2e6)"/>
  <g fill="var(--surface, #fff)" stroke="var(--text, #1b1b1b)" stroke-width="1.4">
    <rect x="38" y="36" width="72" height="70" rx="2"/>
    <rect x="118" y="50" width="78" height="56" rx="2"/>
    <path d="M114 50 L157 24 L200 50" fill="var(--surface, #fff)" stroke-linejoin="round"/>
  </g>
  <g fill="var(--bg, #ebeced)" stroke="var(--border, #dfe2e6)" stroke-width="1">
    <rect x="48" y="48" width="18" height="14" rx="1"/>
    <rect x="82" y="48" width="18" height="14" rx="1"/>
    <rect x="48" y="74" width="18" height="14" rx="1"/>
    <rect x="82" y="74" width="18" height="14" rx="1"/>
    <rect x="132" y="62" width="18" height="14" rx="1"/>
    <rect x="164" y="62" width="18" height="14" rx="1"/>
    <rect x="148" y="82" width="12" height="24" rx="1"/>
  </g>
  <text x="120" y="128" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Small flat / house</text>
  <text x="120" y="150" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="10">~1 bath, up to 10 radiators</text>
  <text x="120" y="184" text-anchor="middle" fill="var(--accent, #1863dc)" font-family="system-ui, sans-serif" font-size="16" font-weight="700">24–28 kW</text>
  <text x="120" y="202" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">Combi DHW</text>
  <text x="120" y="230" text-anchor="middle" fill="var(--text, #1b1b1b)" font-family="system-ui, sans-serif" font-size="16" font-weight="700">12–18 kW</text>
  <text x="120" y="248" text-anchor="middle" fill="var(--text-muted, #6b7280)" font-family="system-ui, sans-serif" font-size="11">System / heat-only heating</text>
</svg>
