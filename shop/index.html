<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - MyBoiler Hub</title>
    <meta name="description" content="MyBoiler Shop - heating and hot water products and solutions.">
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
    <style>
        .article-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }
        .article-container {
            flex: 1;
            padding: clamp(2rem, 5vw, 4rem) clamp(20px, 5vw, 40px);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

.article-header {
            margin-bottom: 2.5rem;
        }
        .article-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            line-height: 1.1;
            color: var(--text);
            margin: 0 0 1rem;
            letter-spacing: -0.02em;
        }
        .article-content {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: clamp(1.5rem, 4vw, 3rem);
            margin-bottom: 2rem;
        }
        .article-content p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text);
            margin: 0 0 1.25rem;
        }
    </style>
    <script type="text/javascript" src="/js/site-nav.js" data-cfasync="false"></script>
</head>
<body class="article-page">
    <div class="menu-overlay"></div>
    <div class="nav-mega-backdrop" aria-hidden="true"></div>
    <header class="header">
        <a href="/" class="logo">
            <img src="/img/myboiler-logo-light.svg" alt="MyBoiler Logo" width="200" height="44" class="light-mode-logo js-theme-logo">
            <img src="/img/myboiler-logo-dark.svg" alt="MyBoiler Logo" width="200" height="44" class="dark-mode-logo js-theme-logo">
        </a>
        <div class="tagline">Smarter Heating & Hot Water</div>
        <div class="right-header-items">
            <button class="hamburger-menu" onclick="toggleMenu()" aria-label="Toggle Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <nav id="nav-menu" class="nav-menu"><ul class="nav-list"><li class="nav-item"><a href="/advice/">Advice</a></li><li class="nav-item"><a href="/toolbox/">Toolbox</a></li><li class="nav-item"><a href="/calculators/">Calculators</a></li><li class="nav-item nav-item-cta"><a href="/chat/">Ask AI</a></li></ul></nav>
        </div>
    </header>

    <div class="article-container">
<header class="article-header">
            <h1 class="article-title">Shop</h1>
        </header>

        <article class="article-content">
            <p>For product information and solutions, please contact us.</p>
            <p>A Rated House, 11 Sunnymead Road, London, NW9 8BT<br>+44 020 8123 4411</p>
        </article>
    </div>

    

    

    

    <div id="site-footer"></div>
    <script type="text/javascript" src="/js/site-nav.js" data-cfasync="false"></script>
    <script type="text/javascript" src="/js/menu.js" data-cfasync="false"></script>
</body>
</html>
